# ------------------------------------------------------------------------------
# Render Blueprint Specification (render.yaml)
# Project: TaskFlow - Modern Task Management System
# Repository: https://github.com/gayatriborru/Task-Management.git
# Docs: https://render.com/docs/blueprint-spec
# ------------------------------------------------------------------------------

version: "1"

services:
  # ============================================================================
  # 1. Backend REST API (Node.js + Express)
  # ============================================================================
  - type: web
    name: taskflow-backend-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set your MongoDB Atlas connection string in Render Dashboard
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a secure 256-bit secret
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        fromService:
          type: web
          name: taskflow-frontend-client
          property: host

  # ============================================================================
  # 2. Frontend Web Application (React + Vite + Tailwind CSS)
  # ============================================================================
  - type: web
    name: taskflow-frontend-client
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: taskflow-backend-api
          property: host

