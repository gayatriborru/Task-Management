# ------------------------------------------------------------------------------
# Render Blueprint for Backend Only (server/render.yaml)
# ------------------------------------------------------------------------------

version: "1"

services:
  - type: web
    name: task-management-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: "*"
